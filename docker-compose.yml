# Local PostgreSQL only; the app runs with `npm run dev`. Version 15 matches Light Cloud (D12).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weather']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
